name: CQA checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test scoring and API
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build Vite
        working-directory: frontend
        run: npm run build

  ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ML dependencies
        run: python -m pip install -r ml-service/requirements-dev.txt -r contracts/requirements.txt
      - name: Run ML tests
        env:
          PYTHONPATH: ml-service
          GROQ_API_KEY: ''
          GROQ_FREE_PLAN_CONFIRMED: 'false'
        run: python -m pytest -q ml-service/tests
      - name: Validate 72 contract fixtures
        run: python -B contracts/validate.py

  java-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java regression and packaged Vanilla assets
        env:
          CQA_ML_URL: ''
        run: ./server/mvnw -f server/pom.xml clean verify
      - name: Exact scoring reference
        run: python3 server/src/test/python/scoring_reference.py --check
      - name: Dependency-free JavaScript unit tests
        run: node --experimental-default-type=module --test server/src/test/js/*.test.mjs
      - name: Public tracked content and reachable history scan
        run: |
          python3 -B -m unittest discover -s server/src/test/python -p 'test_public_safety.py'
          python3 -B scripts/check-public-safety.py
      - name: Install Python HTTP service for offline two-service regression
        run: python -m pip install -r ml-service/requirements.txt
      - name: Java and real Python HTTP with fixture provider (no external network)
        env:
          GROQ_API_KEY: ''
          GROQ_FREE_PLAN_CONFIRMED: 'false'
          CQA_ORGANIZER_URL: ''
        run: python -B server/src/test/python/release_smoke.py --ml-python "$(command -v python)"
      - name: Synthetic packaged HTTP regressions
        env:
          CQA_ORGANIZER_URL: ''
          CQA_ML_URL: ''
          GROQ_API_KEY: ''
        run: |
          python3 -B server/src/test/python/workspace_smoke.py
          python3 -B server/src/test/python/organizer_smoke.py
          python3 -B server/src/test/python/review_smoke.py
          python3 -B server/src/test/python/auto_smoke.py
          python3 -B server/src/test/python/batch_smoke.py
