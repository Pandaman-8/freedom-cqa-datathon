spring.application.name=freedom-cqa-java
cqa.version=@project.version@
server.address=127.0.0.1
server.port=8080

# Absolute path, independent of Maven's working directory. Never use the legacy DB.
cqa.db-path=${CQA_DB_PATH:${user.home}/.local/share/freedom-cqa/java/cqa.sqlite}
spring.sql.init.mode=never

# Private Java-side URL; absence keeps startup/health/manual import available.
cqa.organizer-url=${CQA_ORGANIZER_URL:}
cqa.organizer-connect-timeout-ms=${CQA_ORGANIZER_CONNECT_TIMEOUT_MS:3000}
cqa.organizer-response-timeout-ms=${CQA_ORGANIZER_RESPONSE_TIMEOUT_MS:10000}

# Opt-in local ML transport. No provider credentials belong in Java.
cqa.ml-url=${CQA_ML_URL:}
cqa.ml-data-mode=${CQA_ML_DATA_MODE:synthetic_only}
cqa.ml-approval-file=${CQA_ML_APPROVAL_FILE:}
cqa.ml-external-inference-enabled=${CQA_ML_EXTERNAL_INFERENCE_ENABLED:false}
cqa.ml-connect-timeout-ms=${CQA_ML_CONNECT_TIMEOUT_MS:3000}
cqa.ml-response-timeout-ms=${CQA_ML_RESPONSE_TIMEOUT_MS:70000}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
