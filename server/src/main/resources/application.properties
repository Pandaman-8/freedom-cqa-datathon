spring.application.name=freedom-cqa-java
cqa.version=@project.version@
server.address=127.0.0.1
server.port=8080

# Absolute path, independent of Maven's working directory. Never use the legacy DB.
cqa.db-path=${CQA_DB_PATH:${user.home}/.local/share/freedom-cqa/java/cqa.sqlite}
spring.sql.init.mode=never

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
